# context/plan.toml
# This project's plan: intent only, never status (project-plan/v1). plan:status decides
# each step's state from its evidence; plan:add and plan:amend are its only writers.
contract = "project-plan/v1"

threads = [
  { id = "A", title = "Platform" },
]

[[steps]]
id = "A.1"
title = "The project is generated from the platform template"
thread = "A"
done_when = [
  { kind = "task", name = "identity:set" },
  { kind = "task", name = "plan:init" },
]
[[steps]]
id = "A.2"
title = "The lock names this project, as its identity does"
thread = "A"
depends_on = ["A.1"]
because = { "A.1" = "the project took its identity after generation, and its lock kept the template's name" }
done_when = [
  { kind = "proof", test = "tests/integration/test_repository_lock.py::test_this_repositorys_lock_matches_its_project" },
  { kind = "task", name = "setup" },
  { kind = "task", name = "check" },
]
[[steps]]
id = "A.3"
title = "The project takes the platform template forward, without the template's own port history"
thread = "A"
depends_on = ["A.2"]
because = { "A.2" = "the lock named this project first, so setup passes before the template moves" }
done_when = [
  { kind = "proof", test = "tests/test_template_identity_trailer.py::test_the_identity_commit_names_step_a1" },
  { kind = "proof", test = "tests/test_lock.py::test_a_lock_naming_another_project_is_refused" },
  { kind = "task", name = "check" },
]
